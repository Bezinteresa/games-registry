<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Реестр игр</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Список игр по группам: таблица на компьютере, карточки и страница игры на телефоне. Только просмотр, данные из games.json на GitHub. */
:root{
  --bg:#f3f4f7; --surface:#ffffff; --surface-2:#eceef4; --line:#d8dbe5; --fg:#1b1e2b; --muted:#5f6478; --accent:#4b3fd1;
  --live:#1d7a4a; --live-bg:#dcf2e5; --old:#9a5b00; --old-bg:#fdecc8; --review:#1f5fb8; --review-bg:#dce8fb;
  --draft:#4f566b; --draft-bg:#e6e8ef; --rej:#b3261e; --rej-bg:#fbe0dd;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif; --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#12131a; --surface:#1b1d27; --surface-2:#242735; --line:#323648; --fg:#e8e9f0; --muted:#9aa0b6; --accent:#8b80ff;
  --live:#6fd69c; --live-bg:#163526; --old:#f0b452; --old-bg:#3b2a10; --review:#86b4ff; --review-bg:#17284a;
  --draft:#b5bbcf; --draft-bg:#2a2d3c; --rej:#ff8a80; --rej-bg:#45191a; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:max(24px,env(safe-area-inset-top,0px));padding-bottom:max(48px,env(safe-area-inset-bottom,0px))}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:20px}
header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(22px,3.2vw,30px);margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);margin:4px 0 0;max-width:60ch}
.stats{display:flex;flex-wrap:wrap;gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:110px}
.stat b{display:block;font-family:var(--f-display);font-size:20px;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:12px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
input{font:inherit;color:inherit}
.search{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;width:240px;max-width:100%}
.search:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.note{color:var(--muted);font-size:13px;margin:0}
.tablebox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:900px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
thead th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--surface)}
th.gcol,td.gcol{position:sticky;left:0;background:var(--surface);z-index:1;min-width:230px;max-width:280px;border-right:1px solid var(--line)}
tr.group td{background:var(--surface-2);padding:2px 10px}
tr.group td.gcol{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
.gname{font-weight:600;overflow-wrap:anywhere}
.gmeta{color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.ver{font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums}
.cell{display:flex;flex-direction:column;gap:2px;min-width:110px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;width:max-content;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.sm{font-size:11px;padding:1px 8px;gap:5px}.pill.sm::before{width:6px;height:6px}
.s-none{color:var(--muted);border:1px dashed var(--line)}
.s-draft{color:var(--draft);background:var(--draft-bg)}
.s-review{color:var(--review);background:var(--review-bg)}
.s-live{color:var(--live);background:var(--live-bg)}
.s-old{color:var(--old);background:var(--old-bg)}
.s-rejected{color:var(--rej);background:var(--rej-bg)}
.cnote{font-size:11px;color:var(--muted);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.state{padding:28px;text-align:center;color:var(--muted)}
.gtoggle{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-size:13px;font-weight:500;color:var(--fg);padding:6px 2px;width:100%}
.gtoggle:focus-visible,.mcard:focus-visible,.back:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.gtoggle svg{width:16px;height:16px;flex:none;transition:transform .15s}
.gtoggle[aria-expanded="false"] svg{transform:rotate(-90deg)}
.gcount{color:var(--muted);font-family:var(--f-body);font-weight:500;font-size:12px}
.mlist,.detail{display:none}
.mgroup{margin:10px 0 0}
.mcard,.prow{box-sizing:border-box;display:grid;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.mcard{all:unset;box-sizing:border-box;display:grid;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;min-width:0}
.mtop{display:flex;justify-content:space-between;gap:10px;align-items:baseline;min-width:0}
.mtop b{font-weight:600;overflow-wrap:anywhere;min-width:0}
.mchips{display:flex;flex-wrap:wrap;gap:4px}
.mempty{color:var(--muted);font-size:13px;margin:0}
.dhead{display:flex;gap:12px;align-items:center;min-width:0}
.dhead h2{font-family:var(--f-display);font-size:19px;margin:0;overflow-wrap:anywhere;min-width:0}
.back{all:unset;box-sizing:border-box;flex:none;cursor:pointer;width:44px;height:44px;display:grid;place-items:center;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.back svg{width:22px;height:22px}
.dmeta{display:grid;gap:2px;color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.prow{grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.pname{font-weight:600}
.pnote{grid-column:1/-1;color:var(--muted);font-size:13px;overflow-wrap:anywhere}
body.detail-open header,body.detail-open .toolbar,body.detail-open .tablebox,body.detail-open #foot,body.detail-open .mlist{display:none}
body.detail-open .detail{display:grid;gap:10px}
@media (max-width:700px){
  .tablebox,#foot,.legend{display:none}
  .mlist{display:grid;gap:8px}
  body{padding-top:max(16px,env(safe-area-inset-top,0px))}
  .stat{min-width:0;flex:1 1 calc(50% - 8px)}
  .search{width:100%}
}
@media (prefers-reduced-motion:reduce){.gtoggle svg{transition:none}}
/* режим правки */
button.btn,select,textarea{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--surface);border-color:var(--accent);font-weight:600}
.btn.danger{color:var(--rej);border-color:var(--rej)}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.panel input:focus-visible,.panel select:focus-visible,.panel textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.edit-only{display:none}
body.can-edit .edit-only{display:inline-flex}
body.can-edit .cell,body.can-edit .prow,body.can-edit .gname{cursor:pointer}
body.can-edit .cell:hover .pill,body.can-edit .prow:hover{outline:1px solid var(--accent);outline-offset:1px}
body.can-edit .gname:hover{color:var(--accent)}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);border-left:1px solid var(--line);
  box-shadow:-12px 0 32px rgb(0 0 0 / .18);padding:20px;padding-right:max(20px,env(safe-area-inset-right,0px));padding-top:max(20px,env(safe-area-inset-top,0px));
  overflow-y:auto;z-index:20;display:grid;gap:14px;align-content:start}
.panel h2{font-family:var(--f-display);font-size:18px;margin:0}
.panel .row{display:grid;gap:6px}
.panel label,.panel .lbl{font-size:13px;color:var(--muted);font-weight:500}
.panel input:not([type=radio]):not([type=checkbox]),.panel select,.panel textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;width:100%}
.panel textarea{min-height:72px;resize:vertical}
.choices{display:flex;flex-wrap:wrap;gap:6px}
.choices input{position:absolute;opacity:0;pointer-events:none}
.choices label{cursor:pointer;color:var(--fg)}
.choices input:checked + .pill{outline:2px solid var(--accent);outline-offset:1px}
.choices input:focus-visible + .pill{outline:2px solid var(--accent)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.confirm{border:1px solid var(--rej);border-radius:8px;padding:10px;display:grid;gap:8px;background:var(--rej-bg)}
.grow{display:grid;gap:6px;border:1px solid var(--line);border-radius:10px;padding:8px}
.grow .gbtns{display:flex;gap:4px;flex-wrap:wrap}
.grow .btn{padding:4px 8px;font-size:13px}
.check{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin:0}
.hint a{color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;z-index:30;font-size:14px;max-width:calc(100% - 32px)}
[hidden]{display:none!important}
/* иконки игр */
.gi{flex:none;width:36px;height:36px;border-radius:9px;object-fit:cover;background:var(--surface-2);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:15px;color:var(--muted);overflow:hidden}
.gi.md{width:44px;height:44px;border-radius:11px;font-size:17px}
.gi.lg{width:64px;height:64px;border-radius:14px;font-size:24px}
.gwrap{display:flex;gap:10px;align-items:center;min-width:0}
.gwrap>div{min-width:0}
.mcard .mrow{display:flex;gap:12px;align-items:center;min-width:0}
.mcard .mrow>span:not(.gi){display:grid;gap:8px;min-width:0;flex:1}
.iconrow{display:flex;gap:12px;align-items:center}
/* очередь выкладки и колонка VK / OK */
td .cell+.cell{margin-top:6px}
.queue{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:10px;min-width:0}
.qhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.qhead h2{font-family:var(--f-display);font-size:16px;font-weight:700;margin:0}
.qlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:8px}
.qcard{all:unset;box-sizing:border-box;cursor:pointer;display:grid;gap:8px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);min-width:0}
.qcard:hover{border-color:var(--accent)}
.qcard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.qtop{display:flex;gap:10px;align-items:center;min-width:0}
.qtop>span:last-child{display:grid;gap:2px;min-width:0;flex:1}
.qnum{flex:none;font-family:var(--f-display);font-weight:700;font-size:15px;color:var(--accent);min-width:28px;text-align:center}
.qname{font-weight:600;overflow-wrap:anywhere}
.qline{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.qnote{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.qbadge{display:inline-block;margin-left:6px;font-size:11px;font-weight:700;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:0 6px;vertical-align:1px;white-space:nowrap}
body.detail-open .queue{display:none}
@media (max-width:640px){.panel{top:auto;height:min(88vh,680px);width:100%;border-left:0;border-top:1px solid var(--line);border-radius:14px 14px 0 0;padding-bottom:max(20px,env(safe-area-inset-bottom,0px))}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Реестр игр</h1>
      <p class="sub">Где выложена текущая версия каждой игры. <span id="upd"></span></p>
    </div>
    <div class="stats" id="stats"></div>
  </header>
  <section class="queue" id="queue" aria-label="Очередь выкладки"></section>
  <div class="toolbar">
    <input class="search" id="q" type="search" placeholder="Поиск по названию" aria-label="Поиск">
    <button class="btn edit-only primary" type="button" id="addBtn">Добавить игру</button>
    <button class="btn edit-only" type="button" id="groupsBtn">Группы</button>
    <button class="btn" type="button" id="editBtn">Правка</button>
    <div class="legend" id="legend"></div>
  </div>
  <div class="tablebox">
    <table>
      <thead><tr id="headRow"></tr></thead>
      <tbody id="body"><tr><td class="state" colspan="8">Загружаю список игр…</td></tr></tbody>
    </table>
  </div>
  <div class="mlist" id="mlist"><p class="mempty">Загружаю список игр…</p></div>
  <section class="detail" id="detail"></section>
  <p class="note" id="foot">«Старая версия» — на площадке опубликована не та версия, что указана как текущая у игры.</p>
</div>
<aside class="panel" id="panel" hidden aria-label="Правка"></aside>
<div class="toast" id="toast" hidden></div>
<script>
// Данные: games.json из репозитория Bezinteresa/games-registry. Рядом лежащий games.json — запасной вариант.
const SOURCES=['https://raw.githubusercontent.com/Bezinteresa/games-registry/main/games.json','games.json'];
const STATUS={none:'Не выложена',draft:'Черновик',review:'На модерации',live:'Опубликована',rejected:'Отклонена'};
const CHEV='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';
const BACK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>';
let PLATFORMS=[], COLS=[], GROUPS=[], games=[], query='', openId=null, cameFromList=false, collapsed=new Set(), savedCollapse=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
try{const s=localStorage.getItem('collapsedGroups');if(s){savedCollapse=JSON.parse(s);collapsed=new Set(savedCollapse)}}catch{}

function effective(g,pid){
  const p=(g.platforms||{})[pid]||{}; const st=p.status||'none';
  if(st==='live'&&p.version&&g.version&&p.version!==g.version)return{cls:'old',label:'Старая версия',p};
  return{cls:st,label:STATUS[st]||st,p};
}
// Колонки таблицы: VK и OK показываются в одной колонке «VK / OK», в данных остаются раздельными.
function buildCols(){
  const ids=PLATFORMS.map(p=>p.id); COLS=[];
  for(const p of PLATFORMS){
    if(p.id==='ok'&&ids.includes('vk'))continue;
    if(p.id==='vk'&&ids.includes('ok'))COLS.push({name:'VK / OK',ids:['vk','ok'],short:['VK','OK']});
    else COLS.push({name:p.name,ids:[p.id],short:[p.name]});
  }
}
function same(g,ids){
  const v=id=>{const p=(g.platforms||{})[id]||{};return [p.status||'none',p.version||'',p.note||''].join('\u0001')};
  return ids.every(id=>v(id)===v(ids[0]));
}
// части колонки: [[ids, подпись]] — одна часть, если у VK и OK всё одинаково
function colParts(g,c){return c.ids.length===1||same(g,c.ids)?[[c.ids,c.ids.length>1?c.short.join('/'):c.name]]:c.ids.map((id,i)=>[[id],c.short[i]])}
function colChips(g,withNone){
  let out='';
  for(const c of COLS)for(const [ids,label] of colParts(g,c)){const e=effective(g,ids[0]);if(e.cls==='none'&&!withNone)continue;
    out+=`<span class="pill sm s-${e.cls}" title="${esc(label+': '+e.label)}">${esc(label)}</span>`}
  return out;
}
const qOrder=g=>Number(g.next?.order)||999;
const qBadge=g=>g.next?`<span class="qbadge" title="Очередь выкладки">№${esc(g.next.order||'?')}</span>`:'';
function qState(g){return g.next?.ready?'<span class="pill sm s-live">Подготовлена</span>':'<span class="pill sm s-old">Не подготовлена</span>'}
function renderQueue(){
  const q=games.filter(g=>g.next).sort((a,b)=>qOrder(a)-qOrder(b)||(a.name||'').localeCompare(b.name||'','ru'));
  let h=`<div class="qhead"><h2>Очередь выкладки</h2><span class="gcount">${q.length?`игр: ${q.length}, подготовлено: ${q.filter(g=>g.next.ready).length}`:''}</span></div>`;
  if(!q.length)h+='<p class="hint">Пока пусто. Отметьте игру в правке («Изменить данные игры» → «Очередь выкладки») или попросите в чате реестра.</p>';
  else h+='<div class="qlist">'+q.map(g=>`<button class="qcard" type="button" data-open="${esc(g.id)}"><span class="qtop"><span class="qnum">№${esc(g.next.order||'?')}</span>${iconHtml(g)}<span><span class="qname">${esc(g.name)} <span class="ver">${esc(g.version||'')}</span></span><span class="qline">${qState(g)}</span></span></span>${g.next.note?`<span class="qnote">${esc(g.next.note)}</span>`:''}<span class="mchips">${colChips(g,true)}</span></button>`).join('')+'</div>';
  $('queue').innerHTML=h;
}
const RAW='https://raw.githubusercontent.com/Bezinteresa/games-registry/main/';
function iconHtml(g,size=''){
  if(g.icon)return `<img class="gi ${size}" src="${esc(RAW+g.icon+(g.iconV?'?v='+g.iconV:''))}" alt="" loading="lazy" decoding="async">`;
  return `<span class="gi ${size}" aria-hidden="true">${esc((g.name||'?').trim().charAt(0).toUpperCase())}</span>`;
}
const isOpen=k=>!collapsed.has(k)||!!query.trim();
function groupBtn(k,n){return `<button class="gtoggle" type="button" data-group="${esc(k)}" aria-expanded="${isOpen(k)}">${CHEV}<span>${esc(k)}</span><span class="gcount">${n}</span></button>`}
function toggleGroup(k){collapsed.has(k)?collapsed.delete(k):collapsed.add(k);try{localStorage.setItem('collapsedGroups',JSON.stringify([...collapsed]))}catch{};render()}
function readHash(){const h=location.hash.slice(1);openId=h.startsWith('g-')?h.slice(2):null}
window.addEventListener('hashchange',()=>{readHash();render();window.scrollTo(0,0)});
readHash();

function render(){
  const q=query.trim().toLowerCase();
  const list=games.filter(g=>!q||[g.name,g.altName].some(s=>(s||'').toLowerCase().includes(q)));
  const groups=new Map();
  for(const g of list){const k=g.group||'Без группы';if(!groups.has(k))groups.set(k,[]);groups.get(k).push(g)}
  // порядок групп — как в списке groups в games.json; пустые группы показываются, пока нет поиска
  const order=GROUPS.map(g=>g.name);
  if(!q)for(const n of order)if(!groups.has(n))groups.set(n,[]);
  const rank=k=>{const i=order.indexOf(k);return i<0?(k==='Без группы'?1e6:1e5):i};
  const keys=[...groups.keys()].sort((a,b)=>rank(a)-rank(b)||a.localeCompare(b,'ru',{numeric:true}));
  for(const k of keys)groups.get(k).sort((a,b)=>(a.name||'').localeCompare(b.name||'','ru'));
  // таблица
  let t='';
  for(const k of keys){
    t+=`<tr class="group"><td class="gcol">${groupBtn(k,groups.get(k).length)}</td><td colspan="${COLS.length+1}"></td></tr>`;
    if(!isOpen(k))continue;
    if(!groups.get(k).length){t+=`<tr><td class="gcol gmeta">В группе пока нет игр.</td><td colspan="${COLS.length+1}"></td></tr>`;continue}
    for(const g of groups.get(k)){

/* ---------- Правка через GitHub API ----------
   Ключ — fine-grained token GitHub только на этот репозиторий (Contents: Read and write).
   Хранится только в браузере этого компьютера (localStorage), в файлы и репозиторий не попадает. */
const API='https://api.github.com/repos/Bezinteresa/games-registry/contents/games.json';
let TOKEN=null;
try{TOKEN=localStorage.getItem('registryToken')||null}catch{}
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const b64enc=s=>{const b=new TextEncoder().encode(s);let x='';for(let i=0;i<b.length;i+=0x8000)x+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(x)};
const b64dec=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,'')),c=>c.charCodeAt(0)));
function toast(t){const el=$('toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,3000)}
function setEditMode(){document.body.classList.toggle('can-edit',!!TOKEN);$('editBtn').textContent=TOKEN?'Правка: включена':'Правка'}

async function apiLoad(token=TOKEN){
  const r=await fetch(API+'?ref=main&t='+Date.now(),{headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json'},cache:'no-store'});
  if(!r.ok)throw Object.assign(new Error('load'),{status:r.status});
  const j=await r.json();
  return{data:JSON.parse(b64dec(j.content)),sha:j.sha};
}
async function apiSave(data,sha,message){
  const body=JSON.stringify(data,null,2)+'\n';
  const r=await fetch(API,{method:'PUT',headers:{Authorization:'Bearer '+TOKEN,Accept:'application/vnd.github+json','Content-Type':'application/json'},
    body:JSON.stringify({message,content:b64enc(body),sha,branch:'main'})});
  if(!r.ok)throw Object.assign(new Error('save'),{status:r.status});
}
// Изменение всегда применяется к самой свежей версии файла; при одновременной правке — одна повторная попытка.
let busy=false;
async function mutate(fn,message){
  if(busy)return false; busy=true;
  try{
    for(let attempt=0;attempt<2;attempt++){
      const {data,sha}=await apiLoad();
      const res=fn(data); if(res===false)return false;
      data.updated=today();
      try{await apiSave(data,sha,message);applyData(data);toast('Сохранено на GitHub');return true}
      catch(e){if(e.status===409&&attempt===0)continue;throw e}
    }
  }catch(e){
    const s=e.status;
    toast(s===401?'Ключ не подходит или истёк — войдите заново':s===403||s===404?'У ключа нет права записи в этот репозиторий':s===409?'Файл только что изменили — обновите страницу':'Не удалось сохранить, проверьте интернет');
    return false;
  }finally{busy=false}
}
async function apiPutFile(path,b64,message){
  const url='https://api.github.com/repos/Bezinteresa/games-registry/contents/'+path;
  const h={Authorization:'Bearer '+TOKEN,Accept:'application/vnd.github+json'};
  let sha;
  const cur=await fetch(url+'?ref=main&t='+Date.now(),{headers:h,cache:'no-store'});
  if(cur.ok)sha=(await cur.json()).sha;else if(cur.status!==404)throw Object.assign(new Error('file'),{status:cur.status});
  const r=await fetch(url,{method:'PUT',headers:{...h,'Content-Type':'application/json'},body:JSON.stringify({message,content:b64,branch:'main',...(sha?{sha}:{})})});
  if(!r.ok)throw Object.assign(new Error('file'),{status:r.status});
}
function fileToIcon(file){
  return new Promise((res,rej)=>{const img=new Image();
    img.onload=()=>{const s=Math.min(img.width,img.height),c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');x.imageSmoothingQuality='high';
      x.drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,128,128);URL.revokeObjectURL(img.src);res(c.toDataURL('image/png').split(',')[1])};
    img.onerror=()=>rej(new Error('img'));img.src=URL.createObjectURL(file)});
}

    Создать: <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">github.com → Settings → Fine-grained tokens</a>.</p>
    <p class="hint">Ключ хранится только в этом браузере на этом компьютере. Не вставляйте его в чаты и не отправляйте никому.</p>

  if($('liveNow'))$('liveNow').onclick=()=>go({status:'live',version:g.version,note:$('pn').value.trim()});

function slug(s){
  const m={а:'a',б:'b',в:'v',г:'g',д:'d',е:'e',ё:'e',ж:'zh',з:'z',и:'i',й:'y',к:'k',л:'l',м:'m',н:'n',о:'o',п:'p',р:'r',с:'s',т:'t',у:'u',ф:'f',х:'h',ц:'c',ч:'ch',ш:'sh',щ:'sch',ъ:'',ы:'y',ь:'',э:'e',ю:'yu',я:'ya'};
  return String(s).toLowerCase().split('').map(c=>m[c]??c).join('').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60)||'game';
}
function groupOptions(sel){const names=[...new Set([...GROUPS.map(g=>g.name),...games.map(g=>g.group).filter(Boolean)])];

  p.querySelectorAll('[data-up],[data-down]').forEach(b=>b.onclick=async()=>{
    const i=+(b.dataset.up??b.dataset.down),j=b.dataset.up!=null?i-1:i+1,name=GROUPS[i].name;
    after(await mutate(d=>{const a=d.groups,k=a.findIndex(g=>g.name===name),m=k+(j-i);if(k<0||m<0||m>=a.length)return false;[a[k],a[m]]=[a[m],a[k]]},`Порядок групп: ${name}`))});
  p.querySelectorAll('[data-coll]').forEach(c=>c.onchange=async()=>{const name=GROUPS[+c.dataset.coll].name,val=c.checked;
    after(await mutate(d=>{const g=d.groups.find(x=>x.name===name);if(!g)return false;if(val)g.collapsed=true;else delete g.collapsed},`Группа ${name}: ${val?'свёрнута':'развёрнута'} по умолчанию`))});
  p.querySelectorAll('[data-ren]').forEach(b=>b.onclick=()=>{const old=GROUPS[+b.dataset.ren].name;
    $('gBox').innerHTML=`<div class="row"><label for="rn">Новое имя для «${esc(old)}»</label><input id="rn" value="${esc(old)}"><div class="actions"><button class="btn primary" type="button" id="rnOk">Переименовать</button></div></div>`;
    $('rn').focus();$('rnOk').onclick=async()=>{const n=$('rn').value.trim();if(!n||n===old)return;if(GROUPS.some(g=>g.name===n)){toast('Такая группа уже есть');return}
      after(await mutate(d=>{const g=d.groups.find(x=>x.name===old);if(!g)return false;g.name=n;d.games.forEach(x=>{if(x.group===old)x.group=n})},`Группа «${old}» → «${n}»`))}});
  p.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const old=GROUPS[+b.dataset.del].name,n=count(old);
    const opts=`<option value="">Без группы</option>`+GROUPS.filter(g=>g.name!==old).map(g=>`<option>${esc(g.name)}</option>`).join('');
    $('gBox').innerHTML=`<div class="confirm"><span>Удалить группу «${esc(old)}»?${n?` В ней ${n} игр — куда их перенести:`:''}</span>${n?`<select id="moveTo">${opts}</select>`:''}
      <div class="actions"><button class="btn danger" type="button" id="gDel">Удалить группу</button><button class="btn" type="button" id="gNo">Оставить</button></div></div>`;
    $('gNo').onclick=()=>$('gBox').innerHTML='';
    $('gDel').onclick=async()=>{const to=$('moveTo')?$('moveTo').value:'';
      after(await mutate(d=>{d.groups=d.groups.filter(g=>g.name!==old);d.games.forEach(x=>{if(x.group===old)x.group=to})},`Удалена группа: ${old}`))}});
}
$('addBtn').onclick=()=>openGame(null);
$('groupsBtn').onclick=openGroups;

(async()=>{
  setEditMode();
  if(TOKEN){try{const {data}=await apiLoad();applyData(data);return}catch(e){if(e.status===401){TOKEN=null;try{localStorage.removeItem('registryToken')}catch{};setEditMode();toast('Ключ больше не действует — правка выключена')}}}
  for(const url of SOURCES){
    try{
      const r=await fetch(url+(url.startsWith('http')?'?t='+Date.now():''),{cache:'no-store'});
      if(!r.ok)continue;
      applyData(await r.json()); return;
    }catch{}
  }
  const msg='Не удалось загрузить список игр. Проверьте интернет и обновите страницу.';
  $('body').innerHTML=`<tr><td class="state" colspan="8">${msg}</td></tr>`;$('mlist').innerHTML=`<p class="mempty">${msg}</p>`;
})();
</script>
</body>
